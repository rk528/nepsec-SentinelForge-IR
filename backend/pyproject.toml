[project]
name = "sentinelforge-ir-api"
version = "0.1.0"
description = "SentinelForge IR backend API (FastAPI)"
requires-python = ">=3.12"

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pgserver.*"]

[tool.ruff]
line-length = 180
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "S608", "E501", "RUF005", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/services/demo.py" = ["S311"]
